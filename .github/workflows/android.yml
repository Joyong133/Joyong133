name: Build SMS Blocker APK

on:
  push:
    paths:
      - 'android-sms-blocker/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-sms-blocker
    env:
      # The keystore file itself is the secret (repository secret ANSIM_KEYSTORE,
      # base64). These only unlock it, so they can live here.
      SIGNING_STORE_PASSWORD: ansim-message-key
      SIGNING_KEY_PASSWORD: ansim-message-key
      SIGNING_KEY_ALIAS: ansim
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare signing key
        id: sign
        env:
          ANSIM_KEYSTORE: ${{ secrets.ANSIM_KEYSTORE }}
        run: |
          KS="$RUNNER_TEMP/ansim.p12"
          if [ -n "$ANSIM_KEYSTORE" ]; then
            printf '%s' "$ANSIM_KEYSTORE" | tr -d ' \r\n' | base64 -d > "$KS"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            # No saved key yet: sign with a throwaway key so the build still works.
            # APKs from such builds can't update each other (uninstall first).
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias "$SIGNING_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$SIGNING_STORE_PASSWORD" -keypass "$SIGNING_KEY_PASSWORD" \
              -dname "CN=Ansim Message (temporary)"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANSIM_KEYSTORE secret is not set — this APK uses a temporary key and will not install over an existing copy."
          fi
          echo "SIGNING_STORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ansim-message.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sms-blocker-apk
          path: android-sms-blocker/ansim-message.apk
          if-no-files-found: error

      - name: Publish release (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 안심메시지 최신 APK
          body: |
            차단 번호·문구의 문자와 전화를 흔적 없이 막는 기본 SMS 앱. 아래 ansim-message.apk 를 받아 설치하세요.
            ${{ steps.sign.outputs.stable == 'true' && '고정 서명 키로 빌드됨 — 기존 앱 위에 바로 업데이트됩니다.' || '임시 서명 키로 빌드됨 — 설치 전에 기존 앱을 지워야 합니다.' }}
            (Android 8.0+ · 설치 시 "출처를 알 수 없는 앱" 허용 필요)
          files: android-sms-blocker/ansim-message.apk
          make_latest: true
