name: Build SMS Blocker APK

on:
  push:
    paths:
      - 'android-sms-blocker/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-sms-blocker
    env:
      # These only unlock the keystore; the keystore file itself is what must
      # stay private (Actions cache, or the ANSIM_KEYSTORE secret).
      SIGNING_STORE_PASSWORD: ansim-message-key
      SIGNING_KEY_PASSWORD: ansim-message-key
      SIGNING_KEY_ALIAS: ansim
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # The signing key is created once by CI and kept in the Actions cache
      # (never in the repository), so every build is signed with the same key
      # and new APKs install over the existing app. A repository secret
      # ANSIM_KEYSTORE, if added later, takes priority.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.ansim-signing
          key: ansim-signing-key-v1

      - name: Prepare signing key
        id: sign
        env:
          SECRET_KS: ${{ secrets.ANSIM_KEYSTORE }}
        run: |
          CACHED="$HOME/.ansim-signing/ansim.p12"
          valid() { keytool -list -keystore "$1" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" > /dev/null 2>&1; }
          if [ -n "$SECRET_KS" ]; then
            KS="$RUNNER_TEMP/ansim-secret.p12"
            printf '%s' "$SECRET_KS" | tr -d ' \r\n' | base64 -d > "$KS" || true
            valid "$KS" || { echo "::error::ANSIM_KEYSTORE secret is not a valid key (cut off when copying?)."; exit 1; }
            SOURCE=secret
          elif [ -f "$CACHED" ] && valid "$CACHED"; then
            KS="$CACHED"
            SOURCE=cache
          else
            mkdir -p "$(dirname "$CACHED")"
            rm -f "$CACHED"
            keytool -genkeypair -keystore "$CACHED" -storetype PKCS12 -alias "$SIGNING_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$SIGNING_STORE_PASSWORD" -keypass "$SIGNING_KEY_PASSWORD" \
              -dname "CN=Ansim Message"
            KS="$CACHED"
            SOURCE=new
            echo "::warning::Created a new signing key. Uninstall the old app once before installing this APK; later builds reuse this key."
          fi
          echo "Signing key source: $SOURCE"
          keytool -list -keystore "$KS" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" 2>/dev/null | grep -i "SHA-256" || true
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "SIGNING_STORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ansim-message.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sms-blocker-apk
          path: android-sms-blocker/ansim-message.apk
          if-no-files-found: error

      - name: Publish release (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 안심메시지 최신 APK
          body: |
            차단 번호·문구의 문자와 전화를 흔적 없이 막는 기본 SMS 앱. 아래 ansim-message.apk 를 받아 설치하세요.
            ${{ steps.sign.outputs.source == 'new' && '새 서명 키로 처음 빌드됨 — 이번 한 번만 기존 앱을 지우고 설치하세요. 다음부터는 바로 업데이트됩니다.' || '고정 서명 키로 빌드됨 — 기존 앱 위에 바로 업데이트됩니다.' }}
            (Android 8.0+ · 설치 시 "출처를 알 수 없는 앱" 허용 필요)
          files: android-sms-blocker/ansim-message.apk
          make_latest: true
