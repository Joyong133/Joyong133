name: Build OneFocus APK

on:
  push:
    paths:
      - 'onefocus/**'
      - '.github/workflows/onefocus-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: onefocus-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onefocus
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk OneFocus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OneFocus-apk
          path: onefocus/OneFocus.apk

      - name: Publish to release "onefocus-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: onefocus-latest
          target_commitish: ${{ github.sha }}
          name: 원앱 집중 APK (최신 빌드)
          body: |
            원앱 집중(OneFocus) 최신 빌드입니다. 아래 **OneFocus.apk** 를 휴대폰에서 받아 설치하세요.
            빌드 커밋: ${{ github.sha }}
          files: onefocus/OneFocus.apk
          make_latest: false
